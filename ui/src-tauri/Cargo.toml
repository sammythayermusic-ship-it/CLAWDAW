[package]
name = "clawdaw-ui"
version = "0.1.0"
description = "CLAWDAW UI — Tauri 2 + React shell talking to clawdaw_engine over tonic gRPC"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "clawdaw_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.12"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# gRPC client to clawdaw_engine
tonic = "0.12"
prost = "0.13"
prost-types = "0.13"

# async runtime + channel utilities for event streaming
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-stream = "0.1"
futures-core = "0.3"
futures-util = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]
